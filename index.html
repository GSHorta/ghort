<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghort Estúdio Criativo</title>
<meta name="description" content="Ghort — estúdio criativo.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Outfit variável: permite interpolar o peso no hover, em vez de trocar de arquivo -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
</head>
<body>

<style>
/* ==========================================================
   GHORT — one page
   O quadro é o filme do estúdio (SITE_01), com o logotipo e o
   personagem. Do filme foram apagados o blob de cor e as faixas
   de nav e assinatura — esses são texto de verdade aqui, para
   poderem responder ao mouse.
   As posições vêm da medição do quadro original, 1920x1080.
   ========================================================== */
:root{
  --void:#000000;
  --paper:#FFFFFF;
  --ui:"Outfit","Century Gothic",system-ui,-apple-system,sans-serif;
  /* espessuras: repouso e hover */
  --w-fina:200;
  --w-cheia:300;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--paper);
  font-family:var(--ui);
  font-weight:var(--w-fina);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.page{min-height:100svh;display:grid;place-items:center;background:var(--void)}

/* o palco guarda a proporção do filme: nada é cortado.
   --su é 1% da largura do palco — tudo dentro escala junto com ele */
.stage{
  position:relative;
  width:min(100vw, calc(100svh * 16 / 9));
  aspect-ratio:16/9;
  background:var(--void);
  --su:min(1vw, 1.7778svh);
}
.stage video{display:block;width:100%;height:100%;object-fit:contain;background:var(--void)}

/* ---------- texto que engrossa no hover ----------
   o ::before carrega o mesmo texto na espessura cheia, invisível,
   só para reservar a largura: assim nada se desloca ao engrossar */
.lk{
  display:inline-grid;
  color:var(--paper);text-decoration:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.lk::before{
  content:attr(data-t);
  grid-area:1/1;
  font-weight:var(--w-cheia);
  visibility:hidden;
  pointer-events:none;
}
.lk>span{
  grid-area:1/1;
  font-weight:var(--w-fina);
  transition:font-weight .38s cubic-bezier(.22,1,.36,1);
}
.lk:hover>span,.lk:focus-visible>span{font-weight:var(--w-cheia)}
.lk:focus-visible{outline:2px solid var(--paper);outline-offset:5px;border-radius:4px}

/* ---------- nav ---------- */
.nav{
  position:absolute;left:50%;top:8.33%;translate:-50% -50%;
  display:flex;align-items:baseline;
  gap:calc(2.9 * var(--su));
  font-size:calc(2.2 * var(--su));
  letter-spacing:.005em;
  white-space:nowrap;
}

/* ---------- assinatura + ícones ---------- */
.foot{
  position:absolute;left:50%;top:89%;translate:-50% -50%;
  display:flex;align-items:center;
  gap:calc(1.9 * var(--su));
  font-size:calc(2.0 * var(--su));
  white-space:nowrap;
}
.icons{display:flex;align-items:center;gap:calc(1.05 * var(--su))}
.ico{
  width:calc(1.75 * var(--su));aspect-ratio:1;
  display:grid;place-items:center;color:var(--paper);
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.ico svg{
  width:100%;height:100%;
  fill:none;stroke:currentColor;stroke-width:1.35;stroke-linejoin:round;
  transition:stroke-width .38s cubic-bezier(.22,1,.36,1);
}
/* o mesmo princípio do texto: traço fino em repouso, cheio no hover */
.ico:hover svg,.ico:focus-visible svg{stroke-width:1.9}
.ico:hover{transform:translateY(-6%)}
.ico:focus-visible{outline:2px solid var(--paper);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- retrato: o palco encolhe, então nav e assinatura
     saem dele e ancoram na tela ---------- */
@media (max-width:820px), (max-aspect-ratio:3/4){
  .nav,.foot{position:fixed;left:0;translate:none;width:100%;justify-content:center}
  .nav{top:0;padding:clamp(18px,4svh,30px) 16px;font-size:clamp(1rem,4.4vw,1.2rem);gap:clamp(20px,7vw,36px)}
  .foot{top:auto;bottom:0;padding:clamp(18px,4svh,30px) 16px;font-size:clamp(.95rem,4vw,1.1rem);gap:14px}
  .icons{gap:12px}
  .ico{width:22px}
}

@media (prefers-reduced-motion:reduce){
  .lk>span,.ico,.ico svg{transition:none}
}
</style>

<main class="page">
  <div class="stage">
    <video
      id="filme"
      poster="assets/hero-poster.webp"
      autoplay muted loop playsinline preload="auto"
      aria-label="Abertura animada da Ghort: o personagem do estúdio surge por trás do logotipo">
      <!-- WebM/VP9 em 1080p é o principal; o MP4 fica de reserva -->
      <source src="assets/hero.webm" type="video/webm">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>

    <nav class="nav">
      <!-- TROQUE os destinos quando as páginas existirem -->
      <a class="lk" href="#" data-t="Portifólio"><span>Portifólio</span></a>
      <a class="lk" href="#" data-t="Sobre"><span>Sobre</span></a>
    </nav>

    <div class="foot">
      <span class="lk" data-t="Ghort Estúdio Criativo"><span>Ghort Estúdio Criativo</span></span>

      <span class="icons">
        <a class="ico" href="https://wa.me/5531986775149?text=Ol%C3%A1%2C%20Ghort%21%20%F0%9F%91%8B%0AEncontrei%20voc%C3%AAs%20pelo%20site%20e%20gostaria%20de%20saber%20mais%20sobre%20como" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.2 20.8 4.5 17.1a8.4 8.4 0 1 1 3.3 3.3l-4.6.4z"/>
            <path d="M9.1 9.5c0 3 2.5 5.5 5.5 5.5.7 0 1.2-.6 1.2-1.3l-1.6-.8-.9.9a6.6 6.6 0 0 1-2.4-2.4l.9-.9-.8-1.6c-.7 0-1.3.6-1.3 1.2z"/>
          </svg><span class="sr">WhatsApp</span>
        </a>

        <a class="ico" href="https://www.instagram.com/ghortdesign/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.2" cy="6.8" r="1.05" fill="currentColor" stroke="none"/>
          </svg><span class="sr">Instagram</span>
        </a>

        <a class="ico" href="https://www.behance.net/Gilmar_HT" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.9 5.8h4.4a2.9 2.9 0 0 1 0 5.7H2.9z"/>
            <path d="M2.9 12.5h5.1a3 3 0 0 1 0 6H2.9z"/>
            <path d="M14.2 6.5h6.9"/>
            <circle cx="17.6" cy="14.4" r="4.2"/>
            <path d="M13.4 14.4h8.4"/>
          </svg><span class="sr">Behance</span>
        </a>
      </span>
    </div>
  </div>
</main>

<script>
(function(){
  var v = document.getElementById('filme');
  if(!v) return;

  /* quem pediu menos movimento fica com o quadro parado */
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    v.removeAttribute('autoplay');
    v.pause();
    return;
  }

  /* alguns navegadores só liberam o autoplay depois de um gesto */
  var tocar = function(){
    var p = v.play();
    if(p && p.catch) p.catch(function(){});
  };
  tocar();
  document.addEventListener('click', tocar, {once:true});
  document.addEventListener('touchstart', tocar, {once:true, passive:true});

  /* aba escondida não precisa decodificar vídeo */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) v.pause(); else tocar();
  });
})();
</script>

</body>
</html>
