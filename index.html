<style>
/* ==========================================================
   GHORT — one page
   O quadro é o próprio filme do estúdio (SITE_01): logotipo,
   personagem, nav e assinatura como foram animados. Do filme
   foram apagados o blob de cor e os dois ícones sociais — os
   ícones são redesenhados aqui em SVG para caber o terceiro.
   As posições vêm da medição do quadro original, 1920x1080.
   ========================================================== */
:root{
  --void:#000000;
  --paper:#FFFFFF;
  --ui:"Poppins","Century Gothic",system-ui,-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--paper);
  font-family:var(--ui);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.page{
  min-height:100svh;
  display:grid;
  place-items:center;
  background:var(--void);
}

/* o palco guarda a proporção do filme: nada é cortado */
.stage{
  position:relative;
  width:min(100vw, calc(100svh * 16 / 9));
  aspect-ratio:16/9;
  background:var(--void);
}
.stage video{
  display:block;width:100%;height:100%;
  object-fit:contain;background:var(--void);
}

/* ---- áreas clicáveis sobre o texto do filme ----
   left/top/width/height vêm da medição do quadro 1920x1080 */
.hit{
  position:absolute;
  left:var(--l);top:var(--t);width:var(--w);height:var(--h);
  display:block;
  border-radius:6px;
  /* o rótulo existe para leitor de tela e busca, sem repetir o texto do filme */
  color:transparent;font-size:1px;text-indent:-9999px;overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.hit::after{
  content:"";position:absolute;left:6%;right:6%;bottom:6%;
  height:max(1.5px,.16em);border-radius:2px;background:var(--paper);
  transform:scaleX(0);transform-origin:right;
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
.hit:hover::after,.hit:focus-visible::after{transform:scaleX(1);transform-origin:left}
.hit:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

/* ---- ícones sociais: desenhados por cima, no traço do filme ----
   os dois originais foram apagados do vídeo para o trio ficar
   com o mesmo peso e espaçamento */
.ico{
  position:absolute;
  left:var(--l);top:var(--t);width:var(--w);aspect-ratio:1;
  display:grid;place-items:center;
  color:var(--paper);border-radius:50%;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .35s ease;
  opacity:.92;
}
.ico svg{width:80%;height:80%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.ico:hover{transform:translateY(-8%) scale(1.08);opacity:1}
.ico:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.ico span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- versão estreita: o texto do filme fica pequeno demais,
        então ele é coberto e reescrito em HTML ---- */
.veil{position:absolute;left:0;width:100%;background:var(--void);display:none}
.veil-top{top:0;height:15%}
.veil-bottom{bottom:0;height:16%}

.m-nav,.m-foot{
  position:fixed;left:0;width:100%;
  display:none;justify-content:center;align-items:center;
  gap:clamp(18px,7vw,34px);
  font-size:clamp(.95rem,4.2vw,1.15rem);
  z-index:5;
}
.m-nav{top:0;padding:clamp(18px,4svh,30px) 20px}
.m-foot{bottom:0;padding:clamp(18px,4svh,30px) 20px;gap:14px}
.m-nav a,.m-foot a{color:var(--paper);text-decoration:none}
.m-foot .icons{display:flex;gap:12px}
.m-foot svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}

@media (max-width:820px), (max-aspect-ratio:3/4){
  .veil{display:block}
  .m-nav,.m-foot{display:flex}
}

@media (prefers-reduced-motion:reduce){
  .hit::after{transition:none}
}
</style>

<main class="page">

  </div>

    <span>Ghort Estúdio Criativo</span>
    <span class="icons">
      <a href="https://wa.me/5531986775149?text=Ol%C3%A1%2C%20Ghort%21%20%F0%9F%91%8B%0AEncontrei%20voc%C3%AAs%20pelo%20site%20e%20gostaria%20de%20saber%20mais%20sobre%20como" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M3.2 20.8 4.5 17.1a8.4 8.4 0 1 1 3.3 3.3l-4.6.4z" stroke-linejoin="round"/><path d="M9.1 9.5c0 3 2.5 5.5 5.5 5.5.7 0 1.2-.6 1.2-1.3l-1.6-.8-.9.9a6.6 6.6 0 0 1-2.4-2.4l.9-.9-.8-1.6c-.7 0-1.3.6-1.3 1.2z" stroke-linejoin="round"/></svg>

</main>

<script>
(function(){
  var v = document.getElementById('filme');
  if(!v) return;

  /* quem pediu menos movimento fica com o quadro parado */
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    v.removeAttribute('autoplay');
    v.pause();
    return;
  }

  /* alguns navegadores só liberam o autoplay depois de um gesto */
  var tocar = function(){
    var p = v.play();
    if(p && p.catch) p.catch(function(){});
  };
  tocar();
  document.addEventListener('click', tocar, {once:true});
  document.addEventListener('touchstart', tocar, {once:true, passive:true});

  /* aba escondida não precisa decodificar vídeo */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) v.pause(); else tocar();
  });
})();
</script>

</body>
