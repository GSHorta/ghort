<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio — Ghort Estúdio Criativo</title>
<meta name="description" content="Projetos de identidade visual, 3D, motion e direção de arte da Ghort.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
</head>
<body>

<style>
/* ==========================================================
   GHORT — portfólio
   Fundo preto, como a home: a navegação é da marca. O branco
   fica para dentro dos projetos, onde o trabalho manda.
   A grade é só imagem — sem título, sem legenda. O nome de cada
   trabalho segue no alt e no rótulo do link, para leitor de tela
   e para busca.
   ========================================================== */
:root{
  --void:#000000;
  --paper:#FFFFFF;
  --linha:rgba(255,255,255,.13);
  --ui:"Outfit","Century Gothic",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --gutter:clamp(20px,5vw,64px);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--paper);
  font-family:var(--ui);font-weight:100;
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--paper);outline-offset:6px;border-radius:6px}
::selection{background:var(--paper);color:var(--void)}

.wrap{max-width:1520px;margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- topo: só a marca, ao centro ---------- */
.topo{
  display:flex;justify-content:center;
  padding-block:clamp(34px,7vh,80px) clamp(28px,6vh,64px);
}
.marca{display:block;transition:opacity .35s ease}
.marca img{
  height:clamp(48px,7vw,96px);width:auto;
}
.marca:hover{opacity:.82}

/* ---------- grade ---------- */
.grade{
  display:grid;gap:clamp(14px,2vw,28px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));
  padding-bottom:clamp(56px,10vh,110px);
}
.card{
  display:block;position:relative;overflow:hidden;
  border-radius:14px;background:#0E0E10;border:1px solid var(--linha);
  aspect-ratio:808/632;
}
.card img,.card video{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s var(--ease);
}
.card:hover img,.card:focus-visible img,
.card:hover video,.card:focus-visible video{transform:scale(1.045)}
/* véu que recua no hover: a capa acende quando o mouse chega */
.card::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,.34);
  transition:opacity .5s ease;
}
.card:hover::after,.card:focus-visible::after{opacity:0}


@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>

<div class="wrap">
  <div class="topo">
    <a class="marca" href="./" aria-label="Ghort — voltar ao início">
      <img src="assets/wordmark.webp" alt="ghort">
    </a>
  </div>

  <main class="grade">
    <a class="card" href="acolab-ventures.html" aria-label="Açolab Ventures — ArcelorMittal">
      <video id="capa-acolab" muted loop playsinline autoplay preload="metadata"
             poster="assets/work/acolab.webp" width="1600" height="900"
             aria-label="Açolab Ventures — tela de menu do jogo, em loop">
        <source src="assets/work/acolab/menu.webm" type="video/webm">
        <source src="assets/work/acolab/menu.mp4" type="video/mp4">
      </video>
    </a>
    <a class="card" href="fruit-flavor.html" aria-label="Fruit &amp; Flavor">
      <img src="assets/work/fruit.webp" alt="Fruit &amp; Flavor" loading="lazy" width="760" height="594">
    </a>
    <a class="card" href="athena-baby.html" aria-label="Athena Baby">
      <img src="assets/work/athena.webp" alt="Athena Baby" loading="lazy" width="760" height="594">
    </a>
    <a class="card" href="contas-vencidas.html" aria-label="Contas Vencidas — Itaú">
      <img src="assets/work/itau.webp" alt="Contas Vencidas — Itaú" loading="lazy" width="760" height="594">
    </a>
  </main>
</div>

<script>
/* quem pediu menos movimento vê a capa parada, no pôster */
(function(){
  var v = document.getElementById("capa-acolab");
  if(v && matchMedia("(prefers-reduced-motion: reduce)").matches){
    v.removeAttribute("autoplay"); v.pause();
  }
})();
</script>

</body>
</html>
