<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Açolab Ventures — Ghort Estúdio Criativo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
<link rel="stylesheet" href="assets/projeto.css">
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="voltar" href="portfolio.html">
      <span class="lk" data-t="← voltar aos trabalhos"><span>← voltar aos trabalhos</span></span>
    </a>
  </div>

  <header class="titulo-proj">
    <h1>Açolab Ventures</h1>
  </header>
</div>

<main class="pecas">
  <!-- o menu abre, como no jogo; daí em diante alterna tela e loop -->
  <video class="loop" muted loop playsinline autoplay preload="metadata"
         poster="assets/work/acolab/menu.webp" width="1600" height="900"
         aria-label="Açolab Ventures — tela de menu">
    <source src="assets/work/acolab/menu.webm" type="video/webm">
    <source src="assets/work/acolab/menu.mp4" type="video/mp4">
  </video>

  <img src="assets/work/acolab/elenco.webp" alt="Açolab Ventures — tela de seleção de personagem" width="1920" height="1080" loading="lazy" decoding="async">

  <video class="loop" muted loop playsinline autoplay preload="metadata"
         poster="assets/work/acolab/select-poster.webp" width="1280" height="720"
         aria-label="Açolab Ventures — seleção de personagem em movimento">
    <source src="assets/work/acolab/select.webm" type="video/webm">
    <source src="assets/work/acolab/select.mp4" type="video/mp4">
  </video>

  <img src="assets/work/acolab/fase1-mapa.webp" alt="Açolab Ventures — mapa da fase 1" width="1920" height="1080" loading="lazy" decoding="async">

  <video class="loop" muted loop playsinline autoplay preload="metadata"
         poster="assets/work/acolab/fase1-poster.webp" width="1280" height="720"
         aria-label="Açolab Ventures — fase 1 em movimento">
    <source src="assets/work/acolab/fase1.webm" type="video/webm">
    <source src="assets/work/acolab/fase1.mp4" type="video/mp4">
  </video>

  <img src="assets/work/acolab/fase2-mapa.webp" alt="Açolab Ventures — mapa da fase 2" width="1920" height="1080" loading="lazy" decoding="async">

  <video class="loop" muted loop playsinline autoplay preload="metadata"
         poster="assets/work/acolab/fase2-poster.webp" width="1280" height="720"
         aria-label="Açolab Ventures — fase 2 em movimento">
    <source src="assets/work/acolab/fase2.webm" type="video/webm">
    <source src="assets/work/acolab/fase2.mp4" type="video/mp4">
  </video>

  <img src="assets/work/acolab/fase3-mapa.webp" alt="Açolab Ventures — mapa da fase 3" width="1920" height="1080" loading="lazy" decoding="async">

  <video class="loop" muted loop playsinline autoplay preload="metadata"
         poster="assets/work/acolab/sprites-poster.webp" width="1600" height="900"
         aria-label="Açolab Ventures — sprites dos personagens">
    <source src="assets/work/acolab/sprites.webm" type="video/webm">
    <source src="assets/work/acolab/sprites.mp4" type="video/mp4">
  </video>

  <!-- créditos fecham a sequência antes do filme -->
  <img src="assets/work/acolab/creditos.webp" alt="Açolab Ventures — créditos: direção de arte Gilmar Horta, animação Francis, roteiro Lorena Otero, agência Buffalo, cliente ArcelorMittal" width="1920" height="1080" loading="lazy" decoding="async">

  <div class="filme filme--largo">
    <video controls preload="metadata" playsinline
           poster="assets/work/acolab/filme-poster.webp" width="1920" height="1080"
           aria-label="Açolab Ventures — filme completo">
      <source src="assets/work/acolab/filme.webm" type="video/webm">
      <source src="assets/work/acolab/filme.mp4" type="video/mp4">
    </video>
  </div>
</main>

<div class="wrap voltar-fim">
  <a class="voltar" href="portfolio.html">
    <span class="lk" data-t="← voltar aos trabalhos"><span>← voltar aos trabalhos</span></span>
  </a>
</div>

<script>
/* quem pediu menos movimento vê os loops parados, no pôster */
(function(){
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("video.loop").forEach(function(v){
    v.removeAttribute("autoplay"); v.pause();
  });
})();
</script>

</body>
</html>
